name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          python examples/make_examples.py
          python -m pixel_diet diff examples/a.png examples/b.png --json report.json --sheet sheet.png --min-psnr 20
          python -m pixel_diet mask examples/mask_pred.png examples/mask_gt.png --classes 1 --min-iou 0.3
          python -m pixel_diet depth examples/depth_pred.npy examples/depth_gt.npy --max-absrel 0.05

      - name: Upload the diff sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-sheet-py${{ matrix.python-version }}
          path: |
            report.json
            sheet.png
          if-no-files-found: ignore
