[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-diet"
version = "0.3.0"
description = "Shrink images before a vision model pays for them: crop, resize and re-encode with named presets. Compares images as numbers too."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mind Space Studio"}]
dependencies = ["numpy>=1.24", "Pillow>=10"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.scripts]
pixel-diet = "pixel_diet.cli:main"
# Old name kept as an alias so existing scripts keep working.
vision-eval = "pixel_diet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = []
