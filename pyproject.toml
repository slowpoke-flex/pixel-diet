[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-diet"
version = "0.2.0"
description = "Put your AI agent on a pixel diet: computer-vision verdicts as ~50-250 tokens of numbers instead of thousands of image tokens."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mind Space Studio"}]
dependencies = ["numpy>=1.24", "Pillow>=10"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
pixel-diet = "pixel_diet.cli:main"
# Old name kept as an alias so existing scripts keep working.
vision-eval = "pixel_diet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = []
